['retire','Retirement age','Umur bersara','Usually 55–60.','Biasanya 55–60.','60','p'],
['agent','Prepared by (agent name)','Disediakan oleh (nama ejen)','','','','t'],
['agentph','Agent contact (phone / email)','Hubungan ejen (telefon / e-mel)','','','','t'],
['nk','Number of dependent children','Bilangan anak tanggungan','Enter 0 or leave blank if none. The child questions and education cost only appear when this is 1 or more.','Isi 0 atau kosongkan jika tiada. Soalan anak dan kos pendidikan hanya keluar jika 1 atau lebih.','','p'],
['kid','Youngest child age','Umur anak bongsu','Leave blank if no dependent children.','Kosongkan jika tiada anak tanggungan.','','p'],
['indep','Child independent at age','Anak berdikari pada umur','Usually 23–25 (finished studies, working).','Biasanya 23–25 (tamat belajar, bekerja).','25','p']]],
['Income, debts & savings (monthly / total)','Pendapatan, hutang & simpanan',[
['income','Monthly gross income','Pendapatan kasar bulanan','Average of last 12 months, incl. stable commission.','Purata 12 bulan lepas, termasuk komisen tetap.','','n'],
['expenses','Monthly household expenses','Perbelanjaan isi rumah bulanan','Exclude debt instalments.','Kecualikan ansuran hutang.','','n'],
['debtpay','Monthly debt instalments','Ansuran hutang bulanan','Home, car, personal, card combined.','Rumah, kereta, peribadi, kad digabungkan.','','n'],
['debt','Outstanding debts NOT covered by takaful','Hutang tertunggak BELUM dilindungi takaful','Exclude MLTA/MRTA or auto-life covered debts.','Kecualikan hutang dilindungi MLTA/MRTA atau auto-life.','','n'],
['savings','Savings & liquid investments','Simpanan & pelaburan mudah cair','Cash, FD, unit trust, ASB. Not EPF. Emergency fund is set aside first.','Tunai, FD, unit amanah, ASB. Bukan KWSP. Dana kecemasan diketepikan dahulu.','','n']]],

['epf','EPF balance','Baki KWSP','Counts towards retirement funding.','Dikira untuk dana persaraan.','','n'],

const BM=[['General inflation (DOSM Aug 2026)','Inflasi am (DOSM Ogos 2026)','1.9%','Headline CPI; health 1.3%, education 2.0%. Planning uses your rate (default 3%).','CPI utama; kesihatan 1.3%, pendidikan 2.0%. Perancangan guna kadar anda (lalai 3%).'],

['Critical illness cover','Perlindungan penyakit kritikal','5× income','5 years of income while recovering.','Pendapatan 5 tahun semasa pulih.'],
['Final expenses','Perbelanjaan akhir','RM 15–40k','Funeral, pusaka administration. Uses RM 25,000.','Pengebumian, pentadbiran pusaka. Guna RM 25,000.']];
const TIPS={
name:[`Full name of the client as it should appear on the report heading. Leave blank for an anonymous report.`,`Nama penuh klien seperti yang mahu dipaparkan pada tajuk laporan. Biarkan kosong jika mahu laporan tanpa nama.`],
age:[`The client's age today. It sets how many working years are left, which is how long the family would lose income if something happens. Example: age 35 and retiring at 60 = 25 working years.`,`Umur klien hari ini. Ia menentukan baki tahun bekerja, iaitu tempoh keluarga kehilangan pendapatan jika sesuatu berlaku. Contoh: umur 35 dan bersara pada 60 = 25 tahun bekerja.`],
retire:[`The age the client plans to stop working, usually 55 to 60. Income is protected until this age (or until the youngest child is independent), and the retirement fund is calculated from this age.`,`Umur klien bercadang berhenti kerja, biasanya 55 hingga 60. Pendapatan dilindungi sehingga umur ini (atau sehingga anak bongsu berdikari), dan dana persaraan dikira bermula pada umur ini.`],
nk:[`How many children still depend on the client financially. Enter 0 or leave blank if none. When 1 or more, the child questions and education cost appear. Adults who rely on the client (such as parents) are not counted here.`,`Berapa anak yang masih bergantung kepada klien dari segi kewangan. Isi 0 atau kosongkan jika tiada. Bila 1 atau lebih, soalan anak dan kos pendidikan akan keluar. Orang dewasa tanggungan (contohnya ibu bapa) tidak dikira di sini.`],
kid:[`Age of the youngest child today (a baby can be 0). Income is protected until this child becomes independent, so a younger child means a longer protection period and a bigger need.`,`Umur anak paling muda hari ini (bayi boleh 0). Pendapatan dilindungi sehingga anak ini berdikari, jadi anak yang lebih muda bermakna tempoh perlindungan lebih panjang dan keperluan lebih besar.`],
indep:[`Age when the youngest child finishes studies, works and can support themselves, usually 23 to 25. The family needs the breadwinner's income until then. Default 25.`,`Umur anak bongsu tamat belajar, bekerja dan boleh menyara diri, biasanya 23 hingga 25. Keluarga memerlukan pendapatan pencari nafkah sehingga umur itu. Lalai 25.`],
income:[`Gross monthly income before tax and EPF: salary plus regular commission and stable side income. Use the average of the last 12 months, not the best month. This is the income the family would lose, so it drives most of the calculations.`,`Pendapatan kasar bulanan sebelum cukai dan KWSP: gaji ditambah komisen tetap dan pendapatan sampingan yang stabil. Guna purata 12 bulan lepas, bukan bulan terbaik. Inilah pendapatan yang hilang daripada keluarga, jadi ia mempengaruhi kebanyakan pengiraan.`],
expenses:[`What the household spends each month on food, utilities, rent or housing, transport, children, phone and takaful contributions. Do not include loan instalments, they are asked separately. Example: RM3,500. It is used to size the 6-month emergency fund.`,`Perbelanjaan isi rumah setiap bulan untuk makanan, utiliti, sewa atau perumahan, pengangkutan, anak-anak, telefon dan caruman takaful. Jangan masukkan ansuran pinjaman, ia ditanya berasingan. Contoh: RM3,500. Ia digunakan untuk mengira dana kecemasan 6 bulan.`],
debtpay:[`Total monthly instalments for home financing, car, personal loans and credit cards. Ask for the latest statements if the client is unsure. Used for the debt ratio check: instalments divided by gross income.`,`Jumlah ansuran bulanan pembiayaan rumah, kereta, pinjaman peribadi dan kad kredit. Minta penyata terkini jika klien tidak pasti. Digunakan untuk semakan nisbah hutang: ansuran dibahagi pendapatan kasar.`],
debt:[`Remaining balance of loans that have no takaful or insurance behind them. If the client passes away, these must be paid by the family. Leave out debts covered by MRTA/MLTA or auto-life, they are settled automatically. Enter the balance, not the monthly instalment.`,`Baki pinjaman yang tiada perlindungan takaful atau insurans. Jika klien meninggal dunia, keluarga yang perlu membayarnya. Jangan masukkan hutang yang dilindungi MRTA/MLTA atau auto-life kerana dilangsaikan secara automatik. Masukkan baki, bukan ansuran bulanan.`],
savings:[`Money the family can reach quickly: cash, fixed deposits, unit trusts, ASB. Do not include EPF or property. The first 6 months of expenses are kept as an emergency fund, and only the balance above that is counted towards the Death/TPD need.`,`Wang yang boleh diakses keluarga dengan cepat: tunai, simpanan tetap, unit amanah, ASB. Jangan masukkan KWSP atau hartanah. 6 bulan perbelanjaan pertama diketepikan sebagai dana kecemasan, dan hanya baki di atasnya dikira untuk keperluan Kematian/TPD.`],
edu:[`Total study cost for all children still to be funded, in today's prices (fees, accommodation, books). Rough guide: public degree RM30,000 to 70,000, private RM60,000 to 150,000, medicine RM250,000 and above, overseas RM200,000 and above. The tool inflates it to the year it is needed.`,`Jumlah kos pengajian semua anak yang masih perlu dibiayai, mengikut harga hari ini (yuran, penginapan, buku). Panduan kasar: ijazah awam RM30,000 hingga 70,000, swasta RM60,000 hingga 150,000, perubatan RM250,000 ke atas, luar negara RM200,000 ke atas. Alat menaikkannya mengikut inflasi sehingga tahun ia diperlukan.`],
eduy:[`Years until the first big fee is due (usually when the child starts college or university). With more than one child, use the average. The longer the wait, the more inflation adds to the cost.`,`Tahun sehingga yuran besar pertama perlu dibayar (biasanya bila anak mula kolej atau universiti). Jika anak lebih seorang, guna purata. Semakin lama tempoh menunggu, semakin banyak inflasi menambah kos.`],
epf:[`Current EPF balance (Account 1 and 2). It is counted as part of the retirement fund and assumed to grow at 5% a year. You can check it in the i-Akaun app.`,`Baki KWSP semasa (Akaun 1 dan 2). Ia dikira sebagai sebahagian dana persaraan dan dianggap tumbuh 5% setahun. Boleh disemak melalui aplikasi i-Akaun.`],
epfm:[`Monthly EPF contribution from employee and employer together, for example 11% plus 12% to 13% of salary. Leave blank for the self-employed who do not contribute. It keeps growing until retirement.`,`Caruman KWSP bulanan oleh pekerja dan majikan digabung, contohnya 11% ditambah 12% hingga 13% gaji. Biarkan kosong bagi yang bekerja sendiri dan tidak mencarum. Ia terus bertambah sehingga bersara.`],
sv:[`Extra money the client sets aside every month specifically for retirement, outside EPF (for example a retirement fund or unit trust). Assumed to grow at 6% a year.`,`Wang tambahan yang diketepikan klien setiap bulan khusus untuk persaraan, di luar KWSP (contohnya dana persaraan atau unit amanah). Dianggap tumbuh 6% setahun.`],
med:[`What a serious illness would cost at a private hospital in today's prices. Guide: bypass surgery RM60,000 to 150,000, cancer RM50,000 to 500,000 and above, kidney transplant RM130,000 to 180,000. The tool grows it by medical inflation for 10 years and compares it with the card limit.`,`Kos penyakit serius di hospital swasta mengikut harga hari ini. Panduan: pembedahan pintasan RM60,000 hingga 150,000, kanser RM50,000 hingga 500,000 ke atas, pemindahan buah pinggang RM130,000 hingga 180,000. Alat menaikkannya mengikut inflasi perubatan selama 10 tahun dan membandingkan dengan had kad.`],
cMed:[`The annual limit of the medical card or plan, the most it pays in one year. Lifetime limits do not count. Example: RM100,000 a year. If the limit is lower than the projected cost, the difference is the gap.`,`Had tahunan kad atau pelan perubatan, jumlah paling banyak yang dibayar dalam setahun. Had seumur hidup tidak dikira. Contoh: RM100,000 setahun. Jika had lebih rendah daripada kos unjuran, bezanya ialah jurang.`],
cDeath:[`Total Death/TPD sum covered across all certificates: family takaful, mortgage takaful (MRTA/MLTA) and hibah. Add employer group cover only if the client has confirmed it, because it ends when the job ends.`,`Jumlah dilindungi Kematian/TPD merentasi semua sijil: takaful keluarga, takaful gadai janji (MRTA/MLTA) dan hibah. Tambah perlindungan kumpulan majikan hanya jika klien mengesahkannya, kerana ia tamat bila pekerjaan tamat.`],

gi:[`Expected yearly rise in everyday prices such as food, rent and school fees. Default 3% is deliberately prudent: DOSM reported headline inflation of 1.9% in August 2026. A higher rate gives bigger future needs.`,`Jangkaan kenaikan harga harian setahun seperti makanan, sewa dan yuran sekolah. Lalai 3% sengaja berhemat: DOSM melaporkan inflasi utama 1.9% pada Ogos 2026. Kadar lebih tinggi menghasilkan keperluan masa depan lebih besar.`],

agent:[`Your name as the takaful consultant. It appears on the report next to the recommended plans so the client knows who prepared it. Optional.`,`Nama anda sebagai perunding takaful. Ia dipaparkan pada laporan bersama pelan yang dicadangkan supaya klien tahu siapa penyedianya. Pilihan.`],
agentph:[`Your phone number or email, shown on the report so the client can reach you to proceed. Optional.`,`Nombor telefon atau e-mel anda, dipaparkan pada laporan supaya klien boleh menghubungi anda untuk meneruskan. Pilihan.`],
ri:[`The age the retirement fund must last to. DOSM life expectancy is about 75, but many people live longer, so 80 or more is safer. A higher age means a bigger retirement fund is needed.`,`Umur yang mesti ditampung dana persaraan. Jangka hayat DOSM sekitar 75, tetapi ramai hidup lebih lama, jadi 80 atau lebih lebih selamat. Umur lebih tinggi bermakna dana persaraan lebih besar diperlukan.`]};

function calc(q){

if(d.gi>30||d.mi>30){$('err').textContent=T('Inflation must be 0–30%.','Inflasi mesti 0–30%.');return}$('err').textContent='';
if(!(d.nk>0))d.edu=0;
let pcF=null;if(saved.pc&&d.nk>0){const ch=(saved.ch||[]).slice(0,Math.min(d.nk,8)).map(c=>c||{}).map(c=>({a:parseFloat(c.a),c:parseFloat(String(c.c||'').replace(/,/g,''))||0,s:parseFloat(c.s)||18}));d.edu=ch.reduce((a,c)=>a+c.c,0);pcF=ch;const ag=ch.filter(c=>!isNaN(c.a)).map(c=>c.a);d.kid=ag.length?Math.min(...ag):NaN}
const g=d.gi/100,m=d.mi/100,R=.05,A=d.income*12;if(d.retire<=d.age)d.retire=d.age+1;
const yw=d.retire-d.age,hasK=d.nk>0&&(pcF?!isNaN(d.kid):$('kid').value.trim()!==''),n=hasK?Math.max(1,Math.min((d.indep||25)-d.kid,yw)):yw;
const pv=Math.abs(R-g)<1e-9?A*.7*n/(1+R):A*.7*(1-Math.pow((1+g)/(1+R),n))/(R-g);
const eduFV=pcF?pcF.reduce((a,c)=>a+c.c*Math.pow(1+g,Math.max(0,c.s-(isNaN(c.a)?c.s:c.a))),0):d.edu*Math.pow(1+g,d.eduy),ef=6*d.expenses,usable=Math.max(0,d.savings-ef),FIN=25000;
const dNeed=pv+d.debt+FIN+eduFV,dHave=d.cDeath+usable;
let ci=0;for(let k=0;k<5;k++)ci+=A*Math.pow(1+g,k);
const mNeed=d.med*Math.pow(1+m,10);
const y=yw,LE=Math.max(d.ri||80,d.retire+5),yr=LE-d.retire,rr=1.04/(1+g)-1,ann=A*.7*Math.pow(1+g,y);
const af=Math.abs(rr)<1e-9?yr:(1-Math.pow(1+rr,-yr))/rr*(1+rr),rNeed=ann*af;
const i5=.05/12,i6=.06/12,N=y*12,fvA=(p,i)=>i?p*(Math.pow(1+i,N)-1)/i:p*N;
const rHave=d.epf*Math.pow(1.05,y)+fvA(d.epfm,i5)+fvA(d.sv,i6),rGap=Math.max(0,rNeed-rHave),rMo=rGap*i6/(Math.pow(1+i6,N)-1);
const dsr=d.debtpay/d.income,sr=(d.income-d.expenses-d.debtpay)/d.income;
const pc=(h,nd)=>nd>0?Math.min(100,h/nd*100):100;
const G=[
{k:T('Death / TPD','Kematian / TPD'),need:dNeed,have:dHave,why:[[T(`Income for ${n} yrs (70%, +${d.gi}%/yr)`,`Pendapatan ${n} thn (70%, +${d.gi}%/thn)`),pv],[T('Debts not covered','Hutang belum dilindungi'),d.debt],[T('Final expenses','Perbelanjaan akhir'),FIN],...(d.edu>0?[[T('Education (inflated)','Pendidikan (inflasi)'),eduFV]]:[]),[T('Less: existing cover','Tolak: perlindungan sedia ada'),-d.cDeath],[T('Less: savings above emergency fund','Tolak: simpanan melebihi dana kecemasan'),-usable]],
tx:T('If the breadwinner passes away or is permanently disabled, the family needs to replace 70% of income (30% was the earner\'s own spending) until '+(hasK?'the youngest child is independent':'retirement age')+', plus debts and funeral costs'+(d.edu>0?' and education':'')+'.','Jika pencari nafkah meninggal atau hilang upaya kekal, keluarga perlu ganti 70% pendapatan (30% ialah perbelanjaan pencari nafkah) sehingga '+(hasK?'anak bongsu berdikari':'umur persaraan')+', serta hutang dan kos pengebumian'+(d.edu>0?' serta pendidikan':'')+'.')},
{k:T('Critical illness','Penyakit kritikal'),need:ci,have:d.cCI,why:[[T('5 years of income (+inflation)','Pendapatan 5 tahun (+inflasi)'),ci],[T('Less: existing CI cover','Tolak: perlindungan CI sedia ada'),-d.cCI]],tx:T('Recovery from cancer, stroke or heart disease often stops work for 3–5 years while bills continue. Hospital bills are paid by the medical card, not this cover.','Pemulihan kanser, strok atau jantung sering menghalang bekerja 3–5 tahun sedangkan bil berterusan. Bil hospital ditanggung kad perubatan, bukan perlindungan ini.')},
{k:T('Medical card','Kad perubatan'),need:mNeed,have:d.cMed,why:[[T('Cost today','Kos hari ini'),d.med],[T(`Cost in 10 yrs at ${d.mi}%`,`Kos 10 thn pada ${d.mi}%`),mNeed],[T('Less: annual limit','Tolak: had tahunan'),-d.cMed]],tx:T(`Medical costs rise much faster than normal prices, so RM${Math.round(d.med).toLocaleString()} today becomes ${RM(mNeed)} in 10 years (doubling about every ${(Math.log(2)/Math.log(1+m)).toFixed(1)} yrs). Review the limit every ~10 years.`,`Kos perubatan naik jauh lebih pantas, jadi RM${Math.round(d.med).toLocaleString()} hari ini menjadi ${RM(mNeed)} dalam 10 tahun (berganda kira-kira setiap ${(Math.log(2)/Math.log(1+m)).toFixed(1)} thn). Semak had setiap ~10 tahun.`)},
{k:T('Retirement','Persaraan'),need:rNeed,have:rHave,mo:rMo,why:[[T(`Yearly need at ${d.retire} (70% income, inflated)`,`Keperluan setahun pada ${d.retire} (70% pendapatan, inflasi)`),ann],[T(`Fund for ${yr} yrs to age ${LE}`,`Dana ${yr} thn hingga umur ${LE}`),rNeed],[T('Projected EPF + savings','Unjuran KWSP + simpanan'),-rHave]],tx:T('Fund needed at retirement so inflation-adjusted income lasts to your target age (return 4% after retirement). EPF grows at 5%, savings at 6% (assumptions).','Dana diperlukan semasa bersara supaya pendapatan berinflasi bertahan sehingga umur sasaran (pulangan 4% selepas bersara). KWSP 5%, simpanan 6% (andaian).')}];
G.forEach(x=>{x.p=pc(x.have,x.need);x.gap=Math.max(0,x.need-x.have)});
const sv6=(g,yy)=>g>0&&yy>0?g*i6/(Math.pow(1+i6,yy*12)-1):0;[0,1].forEach(k=>{G[k].hz=y;G[k].mo=sv6(G[k].gap,y)});G[2].hz=10;G[2].mo=sv6(G[2].gap,10);G[3].hz=y;G[3].ret=1;
const sumN=G.reduce((a,x)=>a+x.need,0),sumH=G.reduce((a,x)=>a+Math.min(x.have,x.need),0);
const H=[{k:T('Emergency fund','Dana kecemasan'),p:pc(d.savings,ef),c:RM(d.savings),g:RM(ef),a:(()=>{const mo=d.expenses?d.savings/d.expenses:0,ok=d.savings>=ef;return T(`What it is: cash you can reach within days, so a job loss, illness or big repair does not force you to borrow or cash out investments. Where you are: your savings of ${RM(d.savings)} cover about ${mo.toFixed(1)} months of expenses. `+(ok?`The 6-month goal (${RM(ef)}) is met. Anything above it counts towards your Death/TPD need.`:`The goal is 6 months (${RM(ef)}), so you are short by ${RM(ef-d.savings)}. Build this first, before investing further.`),`Apa ini: wang tunai yang boleh diakses dalam beberapa hari, supaya kehilangan kerja, sakit atau kerosakan besar tidak memaksa anda berhutang atau mengeluarkan pelaburan. Kedudukan anda: simpanan ${RM(d.savings)} menampung kira-kira ${mo.toFixed(1)} bulan perbelanjaan. `+(ok?`Sasaran 6 bulan (${RM(ef)}) dipenuhi. Lebihan akan dikira untuk keperluan Kematian/TPD.`:`Sasaran ialah 6 bulan (${RM(ef)}), jadi anda kurang ${RM(ef-d.savings)}. Bina dana ini dahulu sebelum melabur lebih lanjut.`))})()},
{k:T('Debt ratio','Nisbah hutang'),p:dsr<=.35?100:Math.max(0,100-(dsr-.35)*300),c:(dsr*100).toFixed(0)+'%',g:'≤35%',a:(()=>{const ok=dsr<=.35,l=RM(d.income*.35);return T(`What it is: the share of your gross income that goes to loan and card instalments (${RM(d.debtpay)} of ${RM(d.income)} a month). Planners prefer 35% or less (about ${l} a month) so enough is left for living costs, savings and takaful contributions. `+(ok?`You are within the limit, which gives room to keep contributions paid even in a tight month.`:`You are above the limit, so one month without income could quickly become a crisis. Consider restructuring loans, settling the costliest debt early and avoiding new commitments.`),`Apa ini: peratusan pendapatan kasar yang digunakan untuk ansuran pinjaman dan kad (${RM(d.debtpay)} daripada ${RM(d.income)} sebulan). Perancang mengutamakan 35% atau kurang (sekitar ${l} sebulan) supaya cukup baki untuk sara hidup, simpanan dan caruman takaful. `+(ok?`Anda dalam had, jadi caruman mudah diteruskan walaupun bulan yang ketat.`:`Anda melebihi had, jadi sebulan tanpa pendapatan boleh cepat menjadi krisis. Pertimbangkan penstrukturan semula pinjaman, langsaikan hutang paling mahal lebih awal dan elakkan komitmen baharu.`))})()},
{k:T('Savings rate','Kadar simpanan'),p:Math.max(0,Math.min(100,sr/.2*100)),c:(sr*100).toFixed(0)+'%',g:'≥20%',a:(()=>{const ok=sr>=.2,left=RM(Math.max(0,d.income-d.expenses-d.debtpay)),t=RM(d.income*.2);return T(`What it is: what remains of your income after living costs and debt payments, available for savings and goals. You keep about ${left} a month (${(Math.max(0,sr)*100).toFixed(0)}%). `+(ok?`This meets the 20% goal (${t} a month), so you have capacity to fund the gaps above.`:`The goal is 20% (${t} a month). Review spending, or set up a regular savings takaful plan so saving happens automatically.`),`Apa ini: baki pendapatan selepas perbelanjaan hidup dan bayaran hutang, untuk simpanan dan matlamat. Anda menyimpan sekitar ${left} sebulan (${(Math.max(0,sr)*100).toFixed(0)}%). `+(ok?`Ini memenuhi sasaran 20% (${t} sebulan), jadi anda mampu menampung jurang di atas.`:`Sasaran ialah 20% (${t} sebulan). Semak perbelanjaan, atau sediakan pelan takaful simpanan berkala supaya menyimpan berlaku secara automatik.`))})()}];

function ovw(L){const mx=Math.max(...L.G.map(x=>Math.max(x.need,x.have)))||1;return `<div class="glass"><h2>${T('Protection overview: need vs what you have','Gambaran perlindungan: keperluan berbanding sedia ada')}</h2>${L.G.map(x=>`<div style="margin-top:12px"><div class="sm" style="display:flex;justify-content:space-between"><b>${x.k}</b><span class="m">${cl(x.p)[1]} · ${Math.round(x.p)}%</span></div><div class="bar" style="margin:5px 0"><i class="gr" data-w="${x.need/mx*100}"></i></div><div class="bar"><i class="gt" data-w="${x.have/mx*100}"></i></div><div class="sm" style="display:flex;justify-content:space-between"><span style="color:var(--redt)">${T('Need','Perlu')} ${RM(x.need)}</span><span style="color:var(--tealt)">${T('Have','Ada')} ${RM(x.have)}</span></div></div>`).join('')}</div>`}

function glos(){const g=[['TPD',T('Total Permanent Disability: you can no longer work or live independently, so income stops although you are alive.','Hilang Upaya Kekal Sepenuhnya: anda tidak lagi boleh bekerja atau berdikari, jadi pendapatan terhenti walaupun anda masih hidup.')],[T('Critical illness','Penyakit kritikal'),T('A lump sum paid when diagnosed with a covered serious illness such as cancer, heart attack or stroke. Use it for lost income and other costs.','Jumlah sekali bayar apabila disahkan menghidap penyakit serius yang dilindungi seperti kanser, serangan jantung atau strok. Gunakan untuk pendapatan yang hilang dan kos lain.')],[T('Medical card','Kad perubatan'),T('Pays hospital bills directly up to an annual limit. It does not replace your income.','Membayar bil hospital terus sehingga had tahunan. Ia tidak menggantikan pendapatan anda.')],[T('Inflation','Inflasi'),T('The yearly rise in prices. RM100 of cost today needs more ringgit in future, and medical costs rise faster than everyday prices.','Kenaikan harga setahun. Kos RM100 hari ini memerlukan lebih banyak ringgit pada masa depan, dan kos perubatan naik lebih pantas daripada harga harian.')],[T('Self-fund / month','Simpan sendiri / bulan'),T('The monthly amount you would have to save yourself, at 6% return, to close a gap by the end of the period shown.','Jumlah sebulan yang perlu anda simpan sendiri, pada pulangan 6%, untuk menutup jurang menjelang akhir tempoh yang ditunjukkan.')]];return `<div class="glass"><h2>${T('Simple glossary','Glosari ringkas')}</h2>${g.map(x=>`<div class="row" style="display:block"><b>${x[0]}</b><div class="sm m">${x[1]}</div></div>`).join('')}</div>`}

if(G[2].gap>0)it.push([T('Medical takaful card','Kad takaful perubatan'),T(`Consider a medical takaful card with an annual limit of about ${RM(G[2].need)} to keep pace with medical inflation over 10 years (current limit ${RM(d.cMed)}). Review the limit about every 10 years.`,`Pertimbangkan kad takaful perubatan dengan had tahunan sekitar ${RM(G[2].need)} untuk menyaingi inflasi perubatan 10 tahun (had semasa ${RM(d.cMed)}). Semak had kira-kira setiap 10 tahun.`)]);

const any=G.some(x=>x.gap>0),st=[T('Agree the priorities and sums covered','Bersetuju tentang keutamaan dan jumlah dilindungi'),T('Choose the plan(s) and compare contributions','Pilih pelan dan bandingkan caruman'),T('Complete the application and health declaration','Lengkapkan permohonan dan pengisytiharan kesihatan'),T('Cover starts once the application is approved','Perlindungan bermula selepas permohonan diluluskan')];
return `<div class="glass glow"><h2>${T('Recommended takaful solutions','Penyelesaian takaful yang disyorkan')}</h2><p class="m sm">${T('Plans to consider for the gaps found above, in order of importance.','Pelan yang wajar dipertimbangkan bagi jurang di atas, mengikut keutamaan.')}</p>${it.map((x,i)=>`<div style="display:flex;gap:10px;margin-top:12px"><span class="pill" style="background:var(--teal);height:fit-content">${i+1}</span><div><b>${x[0]}</b><div class="sm m">${x[1]}</div></div></div>`).join('')}${any?`<div class="sm" style="margin-top:16px;font-weight:700;color:var(--tealt)">${T('HOW TO GET PROTECTED','CARA UNTUK DILINDUNGI')}</div><div class="grid" style="margin-top:8px">${st.map((x,i)=>`<div class="bm"><span class="sm m">${T('Step','Langkah')} ${i+1}</span><div class="sm" style="margin-top:2px">${x}</div></div>`).join('')}</div>`:''}${d.agent?`<div class="bm" style="margin-top:14px;border-left-color:var(--red)"><span class="sm m">${T('Prepared by your takaful consultant','Disediakan oleh perunding takaful anda')}</span><b style="font-size:18px;color:var(--fg)">${d.agent}</b>${d.agentph?`<span class="sm">${d.agentph}</span>`:''}</div>`:''}<p class="sm m" style="margin:12px 0 0">${T('Recommendations are indicative. The final plan, sum covered and contribution depend on underwriting, product terms and what the client can comfortably afford.','Cadangan ini indikatif. Pelan, jumlah dilindungi dan caruman akhir bergantung pada penilaian risiko, terma produk dan kemampuan klien.')}</p></div>`}
function exs(L){const d=L.d,o=Math.round(L.o),c=cl(L.o),nm=d.name||T('The client','Klien'),G=L.G.map((x,i)=>({...x,i})),gs=G.filter(x=>x.gap>0).sort((a,b)=>b.gap-a.gap),oks=G.filter(x=>x.gap<=0),bad=L.H.filter(h=>h.p<100);

return `<div class="glass glow pb"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center"><span class="pill" style="background:linear-gradient(110deg,var(--red),var(--teal));padding:5px 14px;letter-spacing:.08em">${T('EXECUTIVE SUMMARY','RINGKASAN EKSEKUTIF')}</span><span class="m sm">${nm} · ${T('Age','Umur')} ${d.age} · ${new Date().toLocaleDateString('en-MY')}</span></div><h2 style="margin:12px 0 4px;font-size:22px;line-height:1.25">${vt}</h2><div class="grid" style="margin-top:12px">${tile(T('Protection score','Skor perlindungan'),o+'%',c[2])}${tile(T('Total gap to close','Jumlah jurang'),RM(L.tot),L.tot>0?'var(--redt)':'var(--tealt)')}${tile(T('Goals on track','Matlamat tercapai'),oks.length+' / 4',oks.length==4?'var(--tealt)':'var(--amb)')}${tile(T('Self-fund cost / month','Kos simpan sendiri / bulan'),RM(L.G.reduce((a,x)=>a+(x.mo||0),0)),'var(--amb)')}</div>${gs.length?`<div class="sm" style="margin-top:16px;font-weight:700;color:var(--tealt)">${T('PRIORITY ACTIONS (largest gap first)','TINDAKAN KEUTAMAAN (jurang terbesar dahulu)')}</div>`+gs.map((x,i)=>`<div style="display:flex;gap:10px;align-items:center;margin-top:10px"><span class="pill" style="background:var(--red)">${i+1}</span><div style="flex:1"><div class="sm" style="display:flex;justify-content:space-between;gap:8px"><b>${x.k}</b><b style="color:var(--redt)">${RM(x.gap)}</b></div><div class="bar" style="margin:4px 0"><i class="${cl(x.p)[0]}" data-w="${x.p}"></i></div><div class="sm m">${act[x.i]}</div>${x.mo>0?`<div class="sm" style="color:var(--amb)">${T('Self-fund: ','Simpan sendiri: ')}<b>${RM(x.mo)}${T(' / month',' / bulan')}</b></div>`:''}</div></div>`).join(''):''}<div class="grid" style="margin-top:16px"><div class="bm"><span class="sm m">${T('What is working','Apa yang baik')}</span><div class="sm" style="margin-top:4px">${[...oks.map(x=>x.k),...L.H.filter(h=>h.p>=100).map(h=>h.k)].map(t=>'✔ '+t).join('<br>')||T('No goal fully met yet.','Belum ada matlamat dipenuhi sepenuhnya.')}</div></div><div class="bm r"><span class="sm m">${T('Watch-outs','Perlu diberi perhatian')}</span><div class="sm" style="margin-top:4px">${bad.map(h=>`⚠ ${h.k}: ${h.c} (${T('goal','sasaran')} ${h.g})`).join('<br>')||T('No health-check concerns.','Tiada isu semakan kesihatan.')}</div></div></div>${L.G.some(x=>x.mo>0)?`<div class="bm" style="margin-top:14px;border-left-color:var(--amb)"><span class="sm m">${T('Is takaful worth it?','Adakah takaful berbaloi?')}</span><div class="sm" style="margin-top:4px">${T(`Self-funding every gap means setting aside about ${RM(L.G.reduce((a,x)=>a+(x.mo||0),0))} each month, and the protection is only complete years from now. Takaful can provide protection from day one. Ask your consultant for a contribution quotation and compare it with this figure.`,`Menyimpan sendiri bagi semua jurang bermakna mengetepikan sekitar ${RM(L.G.reduce((a,x)=>a+(x.mo||0),0))} setiap bulan, dan perlindungan hanya lengkap bertahun-tahun kemudian. Takaful boleh memberi perlindungan dari hari pertama. Minta sebut harga caruman daripada perunding anda dan bandingkan dengan angka ini.`)}</div></div>`:''}</div>`}
